services:
  app:
    build:
      context: .
      dockerfile: harness/docker/php/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.1-apache-bookworm}
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db-test
      DB_PORT: 3306
      DB_DATABASE: saiz_test
      DB_USERNAME: saiz
      DB_PASSWORD: saiz
      APP_ENV: testing
      APP_DEBUG: ${APP_DEBUG:-true}
      WORDPRESS_URL: http://wp-stub:8080
      WORDPRESS_USER: test
      WORDPRESS_APP_PASSWORD: test
      WORDPRESS_CATEGORY_ID: 1

  db-test:
    image: mysql:8.0
    environment:
      TZ: Asia/Tokyo
      MYSQL_DATABASE: saiz_test
      MYSQL_USER: saiz
      MYSQL_PASSWORD: saiz
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  wp-stub:
    image: wiremock/wiremock:3
    volumes:
      - ./harness/wp-stub/mappings:/home/wiremock/mappings
    ports:
      - "8089:8080"
